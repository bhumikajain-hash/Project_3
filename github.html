<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex flex-col gap-3 justify-center items-center">
  <div class="w-full max-w-xl shadow-xl rounded-2xl p-6 space-y-6 bg-gray-900">

    <h1 class="text-3xl font-bold text-white text-center">GitHub User Finder</h1>

    <!-- Search Box -->
    <div class="flex items-center gap-3 bg-black border border-gray-700 rounded-xl p-4 shadow-sm">
      <input 
        type="text" 
        placeholder="Enter GitHub Username" 
        class="input w-full bg-transparent outline-none text-white placeholder-white/60 text-lg"
      />
      <button class="button px-6 py-2 bg-green-800 text-white rounded-xl font-semibold hover:bg-green-900 transition-all">
        Search
      </button>
    </div>

    </div>

    <div class="card w-full max-w-xl  overflow-hidden bg-gray-800 opacity-100 rounded-xl shadow-inner flex flex-row space-x-6">

        <!-- Loading Animation / Dummy User Card -->
    <div class="bg-gray-800 opacity-90 rounded-xl shadow-inner flex flex-row space-x-6 p-6">
      <!-- Avatar -->
      <div class="w-24 h-24 bg-gray-600 rounded-full animate-pulse">
        <img src="" 
     alt="  " 
     class="w-24 h-24 rounded-full object-cover border-2 border-green-500">

      </div>

      <!-- User Info -->
      <div class="flex-1 flex flex-col justify-center space-y-2 text-white">
        <div class="w-40 h-6 bg-gray-600 rounded animate-pulse"></div> <!-- Name -->
        <div class="w-32 h-4 bg-gray-600 rounded animate-pulse"></div> <!-- Username -->
        <div class="w-60 h-4 bg-gray-600 rounded animate-pulse"></div> <!-- Bio -->

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mt-3 text-center w-full animate-pulse">
          <div class="bg-gray-700 rounded-xl p-3 h-12 "></div> <!-- Repos -->
          <div class="bg-gray-700 rounded-xl p-3 h-12 "></div> <!-- Followers -->
          <div class="bg-gray-700 rounded-xl p-3 h-12 "></div> <!-- Following -->
        </div>

        <!-- Additional Info -->
        <div class="mt-3 space-y-1 text-sm w-full animate-pulse">
          <div class="h-4 bg-gray-700 rounded w-2/3 "></div> <!-- Location -->
          <div class="h-4 bg-gray-700 rounded w-1/2 "></div> <!-- Company -->
          <div class="h-4 bg-gray-700 rounded w-3/4 "></div> <!-- Website -->
        </div>
      </div>
    </div>

    </div>

  <script src="github.js"></script>
</body>
</html>
